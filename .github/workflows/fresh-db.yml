name: Fresh Database Replay

on:
  pull_request:
  push:
    branches: [main, production-hardening]

jobs:
  fresh-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@aa3515eac405eac768fa4a72147c22d88a283c7b # v3.0.0
        with:
          version: 2.99.0
      - run: npm ci
      - run: ./scripts/fresh-db-replay.sh
