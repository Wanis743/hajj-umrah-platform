name: Agency Release Certification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: 10/10 Production Certification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      
      - name: Install dependencies
        run: npm ci
        
      - name: Security Audit & Supply Chain
        run: npm audit --audit-level=high && node scripts/verify-toolchain-config.mjs
        
      - name: Typecheck
        run: npm run typecheck
        
      - name: Lint
        run: npm run lint
        
      - name: Build
        run: npm run build
        
      - name: Fresh DB & Schema Verification
        run: npm run verify:fresh-db
        
      - name: RLS & RBAC Behavioral Tests
        run: node scripts/behavioral-rbac.mjs
        
      - name: Financial Integrity Tests
        run: npm run test:finance-utils
        
      - name: Storage Security Tests
        run: node scripts/verify-storage.mjs
        
      - name: Browser E2E & Accessibility
        run: npm run verify:e2e && npm run verify:e2e:accessibility
        
      - name: Reservation Concurrency Load Test
        run: npm run verify:reservation-concurrency
        
      - name: External Integrations UAT
        run: node scripts/verify-integrations.mjs

      - name: Backup & Disaster Recovery Drill
        run: npm run verify:backup-restore
        
      - name: Generate Release Evidence
        run: node execute_all_evidence.cjs && node scripts/generate-certification-status.mjs
        
      - name: Package Evidence Archive
        run: zip -r evidence.zip release/evidence/ docs/generated/certification-status.json RELEASE_ARTIFACT_HASHES.txt

      - name: Upload Certification Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: 10_10_CERTIFICATION_EVIDENCE
          path: evidence.zip
