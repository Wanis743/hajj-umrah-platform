name: Supply Chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm ls --all --omit=dev --json > /tmp/dependencies.json
      # Writes release/sbom.cdx.json from the resolved production tree, and fails
      # if the document describes nothing. The SBOM this replaced was committed
      # as `{"bomFormat":"CycloneDX","specVersion":"1.4"}` — zero components —
      # and release/manifest.json cited it as "Gate H - Supply chain: VERIFIED".
      - run: npm run verify:sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: release/sbom.cdx.json
