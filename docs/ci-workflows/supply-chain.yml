name: Supply Chain

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm ls --all --omit=dev --json > /tmp/dependencies.json
      - run: node scripts/generate-sbom.mjs