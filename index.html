<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbf7f0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2a1d13" />
    <!-- viewport-fit=cover lets the layout reach under a notch; the safe-area
         insets are then paid back in CSS via .gl-safe-* so nothing lands under
         the status bar or the home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="وكالة بوسالم لخدمات الحج والعمرة — رحلات روحانية بخبرة وإخلاص. باقات مخصصة للحج والعمرة، تأشيرات، حجوزات فنادق، ومرشدون مختصون." />
    <title>وكالة بوسالم لخدمات الحج والعمرة</title>
    <link rel="canonical" href="/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="وكالة بوسالم لخدمات الحج والعمرة" />
    <meta property="og:description" content="رحلات روحانية بخبرة وإخلاص. باقات مخصصة للحج والعمرة، تأشيرات، حجوزات فنادق، ومرشدون مختصون." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      One request, four families, alphabetical because that is the form Google
      caches. Tajawal and Amiri are unchanged and still carry Arabic. Manrope
      and Lora are new and carry only Latin, which is the point: the Tailwind
      `sans`/`serif` stacks put them first, so French and English get a Latin
      design instead of Tajawal's Latin, and Arabic still falls through to the
      Arabic faces per character. Weight ranges are what the app actually asks
      for -- 300 (`font-light`) through 800 (the two 800-weight badge rules in
      index.css) for sans, 400-700 for the display serif, which is every
      `font-serif` weight in use. Variable ranges are one file per subset, and
      the browser only fetches the subsets a page's codepoints need.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Lora:wght@400..700&family=Manrope:wght@300..800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
